<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand">
                <i class="fa-brands fa-spotify" style="color: #1db954; font-size: 28px; margin-right: 10px;"></i> Spotify
            </li>
            <li><a href="index.html">Home</a></li>
            <li><a href="https://google.com" target="_blank">About</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="songList">
            <h1>Best of Bollywood - Super Hits</h1>
            <div class="songItemContainer">
                </div>
        </div>
        
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        
        <div class="icons">
            <i class="fa-solid fa-2x fa-backward-step" id="previous"></i>
            <i class="fa-regular fa-3x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-2x fa-forward-step" id="next"></i>
        </div>
        
        <div class="songInfo">
            <img src="https://i.gifer.com/origin/b4/b4d657e7ef262b88eb5f7ac021edda87.gif" width="42px" alt="playing" id="gif">
            <span id="masterSongName">Select a track to play</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
